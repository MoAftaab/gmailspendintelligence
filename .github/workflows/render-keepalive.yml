name: Keep Render service warm

on:
  schedule:
    # Render free web services sleep after 15 minutes without a request.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://gmailspendintelligence.onrender.com/healthz
